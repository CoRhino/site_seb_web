<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Erreur interne du serveur | AnanasDay</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/image/photo-profil-Facebook.png">
</head>
<body>
<script>/* Applique le thème sauvegardé AVANT le rendu = zéro flash entre les pages. */
(function(){var ok=['yellow','red','green','magenta','rainbow','bw','cyan'];var t=localStorage.getItem('cr-theme');if(ok.indexOf(t)<0){t='yellow';localStorage.setItem('cr-theme',t);}document.body.classList.add('theme-'+t);})();</script>

<div class="noise-overlay"></div>
<div class="floating-ball"></div>

<nav class="site-nav">
    <a href="/index.html" class="nav-logo">🍍 <span>ananas</span>DAY</a>
</nav>

<main class="error-page">

    <div class="error-code">500</div>
    <h1 class="error-title">Erreur interne du serveur</h1>

    <!-- Explication réelle de l'erreur -->
    <p class="error-reasons">Le serveur a planté en essayant de répondre. Ce n'est pas votre faute : c'est un bogue ou un problème de configuration de notre côté. Réessayez dans quelques minutes.</p>

    <!-- BLAGUE ✏️ à écrire par Séb -->

    <nav class="error-nav" aria-label="Autres pages d'erreur">
        Toutes les erreurs :&nbsp;
        <a href="/404.html">404</a> ·
        <a href="/403.html">403</a> ·
        <strong>500</strong> ·
        <a href="/418.html">418</a>
    </nav>

</main>

<!-- THEME SWITCHER · jaune = défaut (signature CoRhino) + grille 3×2 -->
<div class="theme-switcher" aria-label="Changer de thème de couleur">
    <button class="theme-btn theme-btn--main" data-theme="yellow" style="background:#F4E800" aria-label="Jaune Speedyellow (défaut)"></button>
    <div class="theme-grid">
        <button class="theme-btn" data-theme="red"     style="background:#ff0000" aria-label="Rouge"></button>
        <button class="theme-btn" data-theme="green"   style="background:#00ff00" aria-label="Vert"></button>
        <button class="theme-btn" data-theme="magenta" style="background:#ff00ff" aria-label="Mauve"></button>
        <button class="theme-btn" data-theme="rainbow" style="background:linear-gradient(135deg,#f00,#ff0,#0f0,#00f)" aria-label="Arc-en-ciel"></button>
        <button class="theme-btn" data-theme="bw"      style="background:#000;border-color:#555" aria-label="Négatif"></button>
        <button class="theme-btn" data-theme="cyan"    style="background:#00ffff" aria-label="Turquoise"></button>
    </div>
</div>

    <script src="/script.js"></script>

</body>
</html>
